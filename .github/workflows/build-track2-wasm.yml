name: Legacy Track 2 V3 builder (manual only)

# Retained for historical reproducibility. The active Track 2 release lane is
# `.github/workflows/track2-final-verify.yml` and the neural V10 candidate.
# This workflow must never auto-publish an obsolete V3 binary.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain retirement
        run: |
          echo "This is a historical builder only."
          echo "Use track2-final-verify.yml for the active release candidate."
          echo "No binary is committed or registered by this workflow."
