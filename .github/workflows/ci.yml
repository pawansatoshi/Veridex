name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p artifacts
      - run: npm install
      - run: npm audit --audit-level=high | tee artifacts/npm-audit.txt
      - run: npm run typecheck | tee artifacts/typecheck.txt
      - run: npm run build:core | tee artifacts/build.txt
      - run: npm test | tee artifacts/unit-tests.txt
      - name: Wait for live Miner
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 5 https://veridex-ecru.vercel.app/health | grep -q '"ok":true'; then
              echo 'live Miner is reachable'
              exit 0
            fi
            sleep 5
          done
          echo 'live Miner did not become reachable in time'
          exit 1
      - name: Capture live Telegraph Intent registry
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          npm run telegraph:intents > artifacts/telegraph-intents.json 2> artifacts/telegraph-intents-error.txt
      - name: Capture live Telegraph integration registry
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          curl -fsS --max-time 10 https://devnode.telegraphprotocol.com/miner-dispatcher/integrations > artifacts/telegraph-integrations.json
      - name: Real-chain ground truth
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_MINER_URL: https://veridex-ecru.vercel.app
          VERIDEX_GROUND_TRUTH_OUTPUT: artifacts/real-chain-ground-truth.json
        run: npm run verify:real-chain
      - name: Production performance benchmark
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_MINER_URL: https://veridex-ecru.vercel.app
          VERIDEX_BENCHMARK_ADDRESSES: 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48,0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2,0xE592427A0AEce92De3Edee1F18E0157C05861564
          VERIDEX_BENCHMARK_REQUESTS: 5
          VERIDEX_BENCHMARK_CONCURRENCY: 3
        run: |
          npm run benchmark:miner | tee artifacts/production-benchmark.json
      - name: Production response schema
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_MINER_URL: https://veridex-ecru.vercel.app
        run: npm run verify:production-schema | tee artifacts/production-schema.json
      - name: Publish H1 evidence summary
        if: always() && github.ref == 'refs/heads/main'
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const read = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          const gt = read('artifacts/real-chain-ground-truth.json');
          const bench = read('artifacts/production-benchmark.json');
          const schema = read('artifacts/production-schema.json');
          console.log('## Veridex H1 Runtime Evidence');
          console.log(`- commit: \`${process.env.GITHUB_SHA}\``);
          console.log(`- real-chain cases: ${gt ? `${gt.passed}/${gt.caseCount} passed` : 'artifact unavailable'}`);
          if (gt) console.log(`- real-chain metrics: TP=${gt.metrics.truePositive}, TN=${gt.metrics.trueNegative}, FP=${gt.metrics.falsePositive}, FN=${gt.metrics.falseNegative}, inconclusive=${gt.metrics.inconclusive}, unavailable=${gt.metrics.unavailable}, error=${gt.metrics.error}`);
          if (gt) console.log(`- real-chain accuracy: ${gt.metrics.accuracy}`);
          if (bench) for (const item of bench.results ?? []) console.log(`- benchmark ${item.contractAddress}: p50=${item.p50_ms}ms p95=${item.p95_ms}ms p99=${item.p99_ms}ms success=${item.success}/${item.requests} timeouts=${item.timeouts} errors=${item.errors}`);
          if (schema) console.log(`- production schema: \`${schema.schema}\``);
          console.log('- Telegraph live registry snapshots are uploaded as artifacts; they remain a protocol gate until independently confirmed.');
          NODE
      - name: Upload verification artifacts
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: veridex-h1-verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
