name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p artifacts

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Security audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high | tee artifacts/npm-audit.txt

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck | tee artifacts/typecheck.txt

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:core | tee artifacts/build.txt

      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test | tee artifacts/unit-tests.txt

      - name: Wait for live Miner
        id: health
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 5 https://veridex-ecru.vercel.app/health | grep -q '"ok":true'; then
              echo 'live Miner is reachable'
              sleep 10
              exit 0
            fi
            sleep 5
          done
          echo 'live Miner did not become reachable in time'
          exit 1

      - name: Validate Miner YAML against current Telegraph standard
        id: yaml
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-telegraph-yaml.mjs > artifacts/telegraph-yaml-validation.json

      - name: Capture live Telegraph Intent registry
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/check-telegraph-intents.mjs > artifacts/telegraph-intents.json

      - name: Verify live Telegraph Miner integration
        id: integration
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-telegraph-integration.mjs > artifacts/telegraph-integration-verification.json

      - name: Capture live Telegraph integration registry
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          curl -fsS --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 10 \
            https://devnode.telegraphprotocol.com/miner-dispatcher/integrations \
            > artifacts/telegraph-integrations.json

      - name: Verify deployed Phase 01 resilience recovery
        id: resilience
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_RESILIENCE_URL: https://veridex-ecru.vercel.app/health/resilience
        run: |
          curl -fsS --show-error --retry 3 --retry-delay 2 --max-time 15 "$VERIDEX_RESILIENCE_URL" > artifacts/phase01-resilience.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('artifacts/phase01-resilience.json', 'utf8'));
          if (result.schema !== 'veridex.phase01.resilience-self-test.v1' || result.valid !== true || result.injectedFailure !== 'rpc_timeout' || result.timeoutFailures !== 3 || result.circuitOpened !== true || result.halfOpenProbeAllowed !== true || result.recovery !== true) process.exit(1);
          console.log('deployed resilience recovery passed');
          NODE

      - name: Real-chain ground truth
        id: groundtruth
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_MINER_URL: https://veridex-ecru.vercel.app
          VERIDEX_GROUND_TRUTH_OUTPUT: artifacts/real-chain-ground-truth.json
        run: node scripts/verify-real-chain.mjs

      - name: Production performance benchmark
        id: benchmark
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_MINER_URL: https://veridex-ecru.vercel.app
          VERIDEX_BENCHMARK_ADDRESSES: 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48,0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2,0xE592427A0AEce92De3Edee1F18E0157C05861564
          VERIDEX_BENCHMARK_REQUESTS: 3
          VERIDEX_BENCHMARK_CONCURRENCY: 1
          VERIDEX_BENCHMARK_REQUEST_RETRIES: 4
          VERIDEX_BENCHMARK_CONTROL_RETRIES: 3
        run: node scripts/benchmark-miner.mjs > artifacts/production-benchmark.json

      - name: Production response schema
        id: schema
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          VERIDEX_MINER_URL: https://veridex-ecru.vercel.app
        run: node scripts/verify-production-schema.mjs > artifacts/production-schema.json

      - name: Publish H1 evidence summary
        if: always() && github.ref == 'refs/heads/main'
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const readJson = p => { if (!fs.existsSync(p)) return null; try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
          const gt=readJson('artifacts/real-chain-ground-truth.json'); const b=readJson('artifacts/production-benchmark.json'); const s=readJson('artifacts/production-schema.json'); const y=readJson('artifacts/telegraph-yaml-validation.json'); const i=readJson('artifacts/telegraph-integration-verification.json'); const r=readJson('artifacts/phase01-resilience.json');
          console.log('## Veridex H1 Runtime Evidence');
          console.log(`- commit: \`${process.env.GITHUB_SHA}\``);
          console.log(`- Miner YAML: ${y?.valid ? 'valid' : 'failed/unavailable'}`);
          console.log(`- live Telegraph integration: ${i?.valid ? 'verified' : 'failed/unavailable'}`);
          console.log(`- resilience recovery: ${r?.valid ? 'verified' : 'failed/unavailable'}`);
          console.log(`- real-chain: ${gt ? `${gt.passed}/${gt.caseCount} passed` : 'failed/unavailable'}`);
          if(gt?.metrics) console.log(`- metrics: TP=${gt.metrics.truePositive}, TN=${gt.metrics.trueNegative}, FP=${gt.metrics.falsePositive}, FN=${gt.metrics.falseNegative}, inconclusive=${gt.metrics.inconclusive}, unavailable=${gt.metrics.unavailable}, error=${gt.metrics.error}, accuracy=${gt.metrics.accuracy}`);
          if(b) for(const x of b.results??[]) console.log(`- benchmark ${x.contractAddress}: cold=${x.cold_ms}ms warm_p50=${x.warm_p50_ms}ms warm_p95=${x.warm_p95_ms}ms warm_p99=${x.warm_p99_ms}ms success=${x.success}/${x.requests} timeouts=${x.timeouts} errors=${x.errors}`);
          if(s) console.log(`- production schema: \`${s.schema}\``);
          NODE

      - name: Enforce blocking H1 gates
        if: always() && github.ref == 'refs/heads/main'
        env:
          AUDIT: ${{ steps.audit.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          YAML: ${{ steps.yaml.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          RESILIENCE: ${{ steps.resilience.outcome }}
          GROUNDTRUTH: ${{ steps.groundtruth.outcome }}
          BENCHMARK: ${{ steps.benchmark.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
        run: |
          failed=0
          for value in "$AUDIT" "$TYPECHECK" "$BUILD" "$UNIT" "$HEALTH" "$YAML" "$INTEGRATION" "$RESILIENCE" "$GROUNDTRUTH" "$BENCHMARK" "$SCHEMA"; do [ "$value" = success ] || failed=1; done
          [ "$failed" -eq 0 ] || { echo 'One or more blocking H1 gates failed.'; exit 1; }
          echo 'ALL BLOCKING H1 GATES PASSED.'

      - name: Upload verification artifacts
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: veridex-h1-verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
