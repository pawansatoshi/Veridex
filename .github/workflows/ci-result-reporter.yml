name: CI Result Reporter

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Record current CI result
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion ?? 'unknown';
            const sha = run.head_sha;
            const title = `CI RESULT ${sha.slice(0, 12)} — ${conclusion.toUpperCase()}`;
            const body = [
              `workflow: ${run.name}`,
              `run: ${run.html_url}`,
              `commit: ${sha}`,
              `branch: ${run.head_branch}`,
              `status: ${run.status}`,
              `conclusion: ${conclusion}`,
              '',
              'This issue is an internal machine-readable CI result checkpoint.',
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-result',
              per_page: 100,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-result'],
              });
            } else {
              await github.rest.issues.updateComment;
            }
