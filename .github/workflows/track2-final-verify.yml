name: Track 2 final WASM verify

on:
  push:
    branches: [main]
    paths:
      - 'telegraph/evaluation/neural/**'
      - 'telegraph/evaluation/track2-benchmark-v2.json'
      - 'telegraph/evaluation/track2-preflight.js'
      - 'telegraph/evaluation/track2-tournament.js'
      - 'telegraph/evaluation/track2-mutation-suite.mjs'
      - 'telegraph/evaluation/BUILD.md'
      - 'telegraph/evaluation/TRACK2_BLUEPRINT.md'
      - 'telegraph/evaluation/TRACK2_RELEASE_BLUEPRINT.md'
      - 'telegraph/evaluation/UPSTREAM_NOTICE.md'
      - '.github/workflows/track2-final-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track2-final
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt golang-go python3

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Build Veridex neural-hybrid candidate
        run: |
          python3 telegraph/evaluation/neural/build_candidate.py \
            --out telegraph/evaluation/veridex-track2-final.wasm

      - name: Structural validation
        run: |
          wasm-validate telegraph/evaluation/veridex-track2-final.wasm
          SIZE=$(stat -c%s telegraph/evaluation/veridex-track2-final.wasm)
          test "$SIZE" -le 33554432
          IMPORTS=$(wasm-objdump -x telegraph/evaluation/veridex-track2-final.wasm | grep -c '^ *import' || true)
          test "$IMPORTS" -eq 0
          echo "WASM size: $SIZE bytes"
          echo "WASM imports: $IMPORTS"

      - name: Run preflight edge and determinism gates
        run: |
          node telegraph/evaluation/track2-preflight.js \
            telegraph/evaluation/veridex-track2-final.wasm \
            telegraph/evaluation/track2-benchmark-v2.json

      - name: Run ordering tournament
        run: |
          node telegraph/evaluation/track2-tournament.js \
            telegraph/evaluation/veridex-track2-final.wasm \
            telegraph/evaluation/track2-benchmark-v2.json

      - name: Run adversarial mutation suite
        run: |
          node telegraph/evaluation/track2-mutation-suite.mjs \
            telegraph/evaluation/veridex-track2-final.wasm \
            telegraph/evaluation/track2-benchmark-v2.json

      - name: Run official Telegraph Wazero checker
        run: |
          git clone --depth=1 https://github.com/neromtoobad/telegraph-wasm-check /tmp/telegraph-wasm-check
          cd /tmp/telegraph-wasm-check
          go run . \
            "$GITHUB_WORKSPACE/telegraph/evaluation/veridex-track2-final.wasm" \
            --cases "$GITHUB_WORKSPACE/telegraph/evaluation/track2-benchmark-v2.json" \
            --strict --json

      - name: Record immutable hash
        run: |
          sha256sum telegraph/evaluation/veridex-track2-final.wasm | tee telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          echo "source baseline commit: dfa0cf7fda72789267811ba2190f61a8eaacedf6" >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          echo "build: neural-hybrid Veridex wrapper + real MiniLM baseline" >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt

      - name: Publish only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          if git diff --cached --quiet; then
            echo 'No generated artifact changes.'
          else
            git commit -m 'build(track2): publish verified neural hybrid wasm'
            git push
          fi
