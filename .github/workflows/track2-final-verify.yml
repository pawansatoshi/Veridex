name: Track 2 final WASM verify

on:
  push:
    branches: [main]
    paths:
      - 'telegraph/evaluation/veridex_evaluator_v7.c'
      - 'telegraph/evaluation/track2-benchmark-v2.json'
      - 'telegraph/evaluation/track2-tournament.js'
      - '.github/workflows/track2-final-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wabt golang-go
      - name: Compile v7
        run: |
          clang --target=wasm32 -O2 -ffreestanding -fno-builtin -nostdlib \
            -Wl,--no-entry -Wl,--export-memory \
            -Wl,--export=alloc -Wl,--export=dealloc \
            -Wl,--export=rank_answer -Wl,--export=breakdown_answer \
            -Wl,--initial-memory=4194304 -Wl,--max-memory=4194304 \
            -o telegraph/evaluation/veridex-evaluator-final.wasm \
            telegraph/evaluation/veridex_evaluator_v7.c
          wasm-validate telegraph/evaluation/veridex-evaluator-final.wasm
          test "$(stat -c%s telegraph/evaluation/veridex-evaluator-final.wasm)" -le 33554432
          test "$(wasm-objdump -x telegraph/evaluation/veridex-evaluator-final.wasm | grep -c 'import' || true)" -eq 0
      - name: Run official Telegraph checker
        run: |
          git clone --depth=1 https://github.com/neromtoobad/telegraph-wasm-check /tmp/telegraph-wasm-check
          cd /tmp/telegraph-wasm-check
          go run . "$GITHUB_WORKSPACE/telegraph/evaluation/veridex-evaluator-final.wasm" \
            --cases "$GITHUB_WORKSPACE/telegraph/evaluation/track2-benchmark-v2.json" --strict --json
      - name: Run Veridex tournament and edge gates
        run: |
          node telegraph/evaluation/track2-tournament.js \
            telegraph/evaluation/veridex-evaluator-final.wasm \
            telegraph/evaluation/track2-benchmark-v2.json
      - name: Publish verified binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegraph/evaluation/veridex-evaluator-final.wasm
          if git diff --cached --quiet; then echo unchanged; else git commit -m 'build(track2): publish v7 verified wasm'; git push; fi
