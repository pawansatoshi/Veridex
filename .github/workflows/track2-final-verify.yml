name: Track 2 final WASM verify

on:
  push:
    branches: [main, track2-v10-hardening, track2-0p35-14p0]
    paths:
      - 'telegraph/evaluation/neural/**'
      - 'telegraph/evaluation/track2-benchmark-v2.json'
      - 'telegraph/evaluation/track2-benchmark-contract-v1.json'
      - 'telegraph/evaluation/track2-expanded-corpus.mjs'
      - 'telegraph/evaluation/track2-golden-differential.mjs'
      - 'telegraph/evaluation/track2-preflight.js'
      - 'telegraph/evaluation/track2-tournament.js'
      - 'telegraph/evaluation/track2-mutation-suite.mjs'
      - 'telegraph/evaluation/track2-live-risk-stress.mjs'
      - '.github/workflows/track2-final-verify.yml'
  pull_request:
    paths:
      - 'telegraph/evaluation/neural/**'
      - 'telegraph/evaluation/track2-benchmark-v2.json'
      - 'telegraph/evaluation/track2-benchmark-contract-v1.json'
      - 'telegraph/evaluation/track2-expanded-corpus.mjs'
      - 'telegraph/evaluation/track2-golden-differential.mjs'
      - 'telegraph/evaluation/track2-preflight.js'
      - 'telegraph/evaluation/track2-tournament.js'
      - 'telegraph/evaluation/track2-mutation-suite.mjs'
      - 'telegraph/evaluation/track2-live-risk-stress.mjs'
      - '.github/workflows/track2-final-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track2-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt golang-go python3 clang lld

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Prepare evidence directory
        run: mkdir -p telegraph/evaluation/ci-evidence

      - name: Build exact 14.0 golden reference
        env:
          RUSTFLAGS: -Aunsafe-op-in-unsafe-fn
        run: |
          set -euo pipefail
          python3 telegraph/evaluation/neural/build_candidate_fast.py \
            --out telegraph/evaluation/veridex-track2-golden14.wasm

      - name: Build final R5 candidate
        env:
          RUSTFLAGS: -Aunsafe-op-in-unsafe-fn
        run: |
          set -euo pipefail
          python3 telegraph/evaluation/neural/build_candidate_fast_release.py \
            --out telegraph/evaluation/veridex-track2-final.wasm

      - name: Structural validation for both artifacts
        run: |
          set -euo pipefail
          for f in telegraph/evaluation/veridex-track2-golden14.wasm telegraph/evaluation/veridex-track2-final.wasm; do
            wasm-validate "$f"
            SIZE=$(stat -c%s "$f")
            test "$SIZE" -le 33554432
            IMPORTS=$(wasm-objdump -x "$f" | grep -c '^ *import' || true)
            test "$IMPORTS" -eq 0
            echo "$f size=$SIZE imports=$IMPORTS"
          done
          wasm-objdump -x telegraph/evaluation/veridex-track2-final.wasm > telegraph/evaluation/ci-evidence/wasm-objdump.txt
          printf 'golden14_size=%s\nfinal_size=%s\n' "$(stat -c%s telegraph/evaluation/veridex-track2-golden14.wasm)" "$(stat -c%s telegraph/evaluation/veridex-track2-final.wasm)" | tee telegraph/evaluation/ci-evidence/structural.txt

      - name: Generate expanded deterministic fraud corpus
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-expanded-corpus.mjs \
            telegraph/evaluation/track2-benchmark-v2.json \
            telegraph/evaluation/track2-expanded-benchmark.json \
            | tee telegraph/evaluation/ci-evidence/expanded-corpus.json

      - name: Compare final candidate against 14.0 golden
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-golden-differential.mjs \
            telegraph/evaluation/veridex-track2-golden14.wasm \
            telegraph/evaluation/veridex-track2-final.wasm \
            telegraph/evaluation/track2-expanded-benchmark.json \
            | tee telegraph/evaluation/ci-evidence/golden-differential.json

      - name: Run primary preflight edge and determinism gates
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-preflight.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-expanded-benchmark.json | tee telegraph/evaluation/ci-evidence/preflight-expanded.json

      - name: Run primary ordering tournament
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-tournament.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-expanded-benchmark.json | tee telegraph/evaluation/ci-evidence/tournament-expanded.json

      - name: Run supplemental contract-security preflight
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-preflight.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-contract-v1.json | tee telegraph/evaluation/ci-evidence/contract-preflight.json

      - name: Run supplemental contract-security tournament
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-tournament.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-contract-v1.json | tee telegraph/evaluation/ci-evidence/contract-tournament.json

      - name: Prepare pinned public Wazero checker
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/neromtoobad/telegraph-wasm-check /tmp/telegraph-wasm-check
          git -C /tmp/telegraph-wasm-check checkout --detach f537c7c085e9d3366c5615fe1ad1f98a0abeff7c
          cd /tmp/telegraph-wasm-check
          go build -trimpath -o /tmp/telegraph-wasm-check-bin .
          /tmp/telegraph-wasm-check-bin --version

      - name: Run public blind-spot hard.json gate
        run: |
          set -euo pipefail
          /tmp/telegraph-wasm-check-bin "$GITHUB_WORKSPACE/telegraph/evaluation/veridex-track2-final.wasm" --cases /tmp/telegraph-wasm-check/examples/hard.json --strict --json | tee "$GITHUB_WORKSPACE/telegraph/evaluation/ci-evidence/public-hard-json.json"

      - name: Run adversarial mutation suite
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-mutation-suite.mjs telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-expanded-benchmark.json | tee telegraph/evaluation/ci-evidence/mutation-suite.json

      - name: Run live-risk margin stress gate (target 0.35)
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-live-risk-stress.mjs telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-expanded-benchmark.json | tee telegraph/evaluation/ci-evidence/live-risk-stress.json

      - name: Run public Wazero compatibility checker
        run: |
          set -euo pipefail
          /tmp/telegraph-wasm-check-bin "$GITHUB_WORKSPACE/telegraph/evaluation/veridex-track2-final.wasm" --cases "$GITHUB_WORKSPACE/telegraph/evaluation/track2-expanded-benchmark.json" --strict --json | tee "$GITHUB_WORKSPACE/telegraph/evaluation/ci-evidence/wazero-checker-expanded.json"

      - name: Record immutable hashes and provenance
        run: |
          set -euo pipefail
          sha256sum telegraph/evaluation/veridex-track2-golden14.wasm | tee telegraph/evaluation/VERIDEX_TRACK2_GOLDEN14_SHA256.txt
          sha256sum telegraph/evaluation/veridex-track2-final.wasm | tee telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          {
            echo "golden 14.0 source commit: 76486fa01a54b7d03c173dedf7a34852e2c38b57"
            echo "source baseline commit: dfa0cf7fda72789267811ba2190f61a8eaacedf6"
            echo "final build: 14.0-derived neural-hybrid + question-aware four-signal composite + high-confidence contradiction caps + 14.0 calibration"
            echo "checker commit: f537c7c085e9d3366c5615fe1ad1f98a0abeff7c"
            echo "target mean margin: 0.35"
            echo "source commit: $GITHUB_SHA"
          } >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt

      - name: Upload exact verified artifacts and evidence
        uses: actions/upload-artifact@v4
        with:
          name: veridex-track2-r5-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            telegraph/evaluation/veridex-track2-final.wasm
            telegraph/evaluation/veridex-track2-golden14.wasm
            telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
            telegraph/evaluation/VERIDEX_TRACK2_GOLDEN14_SHA256.txt
            telegraph/evaluation/track2-expanded-benchmark.json
            telegraph/evaluation/ci-evidence/
