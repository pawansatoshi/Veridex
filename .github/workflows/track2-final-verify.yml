name: Track 2 final WASM verify

on:
  push:
    branches: [main, track2-v10-hardening]
    paths:
      - 'telegraph/evaluation/neural/**'
      - 'telegraph/evaluation/track2-benchmark-v2.json'
      - 'telegraph/evaluation/track2-benchmark-contract-v1.json'
      - 'telegraph/evaluation/track2-preflight.js'
      - 'telegraph/evaluation/track2-tournament.js'
      - 'telegraph/evaluation/track2-mutation-suite.mjs'
      - 'telegraph/evaluation/BUILD.md'
      - 'telegraph/evaluation/TRACK2_BLUEPRINT.md'
      - 'telegraph/evaluation/TRACK2_RELEASE_BLUEPRINT.md'
      - 'telegraph/evaluation/TRACK2_CANDIDATE_MATRIX.md'
      - 'telegraph/evaluation/TRACK2_VALIDATION_REPORT.md'
      - 'telegraph/evaluation/UPSTREAM_NOTICE.md'
      - '.github/workflows/track2-final-verify.yml'
  pull_request:
    paths:
      - 'telegraph/evaluation/neural/**'
      - 'telegraph/evaluation/track2-benchmark-v2.json'
      - 'telegraph/evaluation/track2-benchmark-contract-v1.json'
      - 'telegraph/evaluation/track2-preflight.js'
      - 'telegraph/evaluation/track2-tournament.js'
      - 'telegraph/evaluation/track2-mutation-suite.mjs'
      - 'telegraph/evaluation/BUILD.md'
      - 'telegraph/evaluation/TRACK2_BLUEPRINT.md'
      - 'telegraph/evaluation/TRACK2_RELEASE_BLUEPRINT.md'
      - 'telegraph/evaluation/TRACK2_CANDIDATE_MATRIX.md'
      - 'telegraph/evaluation/TRACK2_VALIDATION_REPORT.md'
      - 'telegraph/evaluation/UPSTREAM_NOTICE.md'
      - '.github/workflows/track2-final-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track2-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt golang-go python3

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Prepare evidence directory
        run: mkdir -p telegraph/evaluation/ci-evidence

      - name: Build Veridex neural-hybrid candidate
        run: |
          python3 telegraph/evaluation/neural/build_candidate.py \
            --out telegraph/evaluation/veridex-track2-final.wasm

      - name: Structural validation
        run: |
          set -euo pipefail
          wasm-validate telegraph/evaluation/veridex-track2-final.wasm
          SIZE=$(stat -c%s telegraph/evaluation/veridex-track2-final.wasm)
          test "$SIZE" -le 33554432
          IMPORTS=$(wasm-objdump -x telegraph/evaluation/veridex-track2-final.wasm | grep -c '^ *import' || true)
          test "$IMPORTS" -eq 0
          wasm-objdump -x telegraph/evaluation/veridex-track2-final.wasm > telegraph/evaluation/ci-evidence/wasm-objdump.txt
          printf 'size=%s\\nimports=%s\\n' "$SIZE" "$IMPORTS" | tee telegraph/evaluation/ci-evidence/structural.txt

      - name: Run primary preflight edge and determinism gates
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-preflight.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-v2.json | tee telegraph/evaluation/ci-evidence/preflight.json

      - name: Run primary ordering tournament
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-tournament.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-v2.json | tee telegraph/evaluation/ci-evidence/tournament.json

      - name: Run supplemental contract-security preflight
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-preflight.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-contract-v1.json | tee telegraph/evaluation/ci-evidence/contract-preflight.json

      - name: Run supplemental contract-security tournament
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-tournament.js telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-contract-v1.json | tee telegraph/evaluation/ci-evidence/contract-tournament.json

      - name: Run public blind-spot hard.json gate
        run: |
          set -euo pipefail
          git clone https://github.com/neromtoobad/telegraph-wasm-check /tmp/telegraph-wasm-check
          git -C /tmp/telegraph-wasm-check checkout --detach f537c7c085e9d3366c5615fe1ad1f98a0abeff7c
          cd /tmp/telegraph-wasm-check
          go run . "$GITHUB_WORKSPACE/telegraph/evaluation/veridex-track2-final.wasm" --cases examples/hard.json --strict --json | tee "$GITHUB_WORKSPACE/telegraph/evaluation/ci-evidence/public-hard-json.json"

      - name: Run adversarial mutation suite
        run: |
          set -euo pipefail
          node telegraph/evaluation/track2-mutation-suite.mjs telegraph/evaluation/veridex-track2-final.wasm telegraph/evaluation/track2-benchmark-v2.json | tee telegraph/evaluation/ci-evidence/mutation-suite.json

      - name: Run public Wazero compatibility checker
        run: |
          set -euo pipefail
          cd /tmp/telegraph-wasm-check
          go run . "$GITHUB_WORKSPACE/telegraph/evaluation/veridex-track2-final.wasm" --cases "$GITHUB_WORKSPACE/telegraph/evaluation/track2-benchmark-v2.json" --strict --json | tee "$GITHUB_WORKSPACE/telegraph/evaluation/ci-evidence/wazero-checker.json"

      - name: Record immutable hash
        run: |
          set -euo pipefail
          sha256sum telegraph/evaluation/veridex-track2-final.wasm | tee telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          echo "source baseline commit: dfa0cf7fda72789267811ba2190f61a8eaacedf6" >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          echo "build: neural-hybrid Veridex wrapper + real MiniLM baseline" >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          echo "checker commit: f537c7c085e9d3366c5615fe1ad1f98a0abeff7c" >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
          echo "source commit: $GITHUB_SHA" >> telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt

      - name: Upload exact verified artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: veridex-track2-v10-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            telegraph/evaluation/veridex-track2-final.wasm
            telegraph/evaluation/VERIDEX_TRACK2_FINAL_SHA256.txt
            telegraph/evaluation/ci-evidence/
