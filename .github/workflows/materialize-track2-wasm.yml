name: Materialize Track 2 WASM

on:
  push:
    branches: [track2-script-author-final]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track2-script-author-final

      - name: Decode WASM
        run: |
          base64 --decode telegraph/evaluation/veridex-evaluator.wasm.b64 > telegraph/evaluation/veridex-evaluator.wasm

      - name: Validate WASM
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const bytes = fs.readFileSync('telegraph/evaluation/veridex-evaluator.wasm');
          if (bytes.subarray(0, 8).toString('hex') !== '0061736d01000000') throw new Error('invalid WASM header');
          WebAssembly.compile(bytes).then(m => {
            const names = WebAssembly.Module.exports(m).map(x => x.name);
            for (const required of ['memory','alloc','dealloc','rank_answer']) {
              if (!names.includes(required)) throw new Error(`missing export: ${required}`);
            }
            console.log('WASM OK:', names.join(', '));
          }).catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegraph/evaluation/veridex-evaluator.wasm
          if git diff --cached --quiet; then
            echo 'WASM binary already materialized.'
          else
            git commit -m 'chore(track2): add materialized WASM binary'
            git push origin HEAD:track2-script-author-final
          fi
