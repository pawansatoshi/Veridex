version: "1"
kind: miner
id: 1001
slug: veridex-contract-risk-miner
protocol: generic
name: Veridex

description: >-
  Evidence-backed smart-contract capability and safety intelligence for agents.
  Veridex analyzes Ethereum contract state and logic to produce traceable
  signals for ownership/control, upgradeability, pause capability, and mint
  authority.

base_url: https://veridex-ecru.vercel.app

docs:
  website: https://veridex-ecru.vercel.app
  repository: https://github.com/pawansatoshi/Veridex

auth:
  type: none

rate_limit_per_sec: 5
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /analyze
    external_path: /analyze
    method: POST
    description: >-
      Analyze an Ethereum smart contract and return evidence-backed capability
      intelligence for ownership, upgradeability, pause and mint authority.

input_schema:
  type: object
  required:
    - chain
    - contractAddress
  properties:
    chain:
      type: string
      description: Ethereum chain identifier; canonical value is 1.
      example: "1"
    contractAddress:
      type: string
      description: EVM contract address to analyze.
      example: "0x0000000000000000000000000000000000000000"
    codeAddress:
      type: string
      description: Optional explicit implementation/code address for proxy analysis.
      example: "0x0000000000000000000000000000000000000000"

output_schema:
  type: object
  required:
    - schema
    - result
    - capabilityIntelligence
  properties:
    schema:
      type: string
      description: Veridex Miner response schema identifier.
      example: veridex.miner.v1
    result:
      type: object
      description: Normalized evidence-backed smart-contract analysis.
    capabilityIntelligence:
      type: object
      description: Derived capability map and evidence graph for agent consumption.

semantics:
  signal_mapping:
    label_field: capabilityIntelligence.state
    confidence_field: capabilityIntelligence.confidence
    reason_field: result.evidence
  supported_intents:
    - FRAUD_DETECTION
