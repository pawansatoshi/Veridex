name: Veridex
version: "1"
description: >-
  Evidence-backed smart-contract risk and safety inference for agents. Veridex
  parses Ethereum contract state and logic to produce verifiable signals for
  ownership/control, upgradeability, pause capability, and mint authority.
base_url: https://veridex-ecru.vercel.app
auth:
  type: none
supported_intents:
  - FRAUD_DETECTION
endpoints:
  - path: /analyze
    method: POST
    description: >-
      Analyze an Ethereum smart contract and return evidence-backed risk and
      capability intelligence.
    input_schema:
      type: object
      additionalProperties: false
      required:
        - chain
        - contractAddress
      properties:
        chain:
          type: string
          description: Ethereum chain identifier. Canonical value is 1.
          enum:
            - "1"
            - ethereum
            - ethereum-mainnet
        contractAddress:
          type: string
          description: EVM contract address to analyze.
        codeAddress:
          type: string
          description: Optional explicit implementation/code address for proxy analysis.
    output_schema:
      type: object
      required:
        - schema
        - result
        - capabilityIntelligence
      properties:
        schema:
          type: string
          const: veridex.miner.v1
        result:
          type: object
        capabilityIntelligence:
          type: object
      additionalProperties: true
limitations:
  - Ethereum mainnet only for the H1 Miner.
  - Contract capability findings are evidence-backed and may be inconclusive when provider or verification evidence is unavailable.
  - Selector presence alone is never treated as semantic proof of a capability.
  - Provider or infrastructure failures are reported as unavailable/error state and are never converted into negative contract findings.
